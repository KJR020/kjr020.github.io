<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">UXの5段階モデル</title>
<desc id="desc">戦略・要件・構造・骨格・表層の5つの層が、抽象的なものから具体的なものへと積み重なる立体図</desc>
<style>
.t{font-family:"Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px;font-weight:600}
.s{font-family:"Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:12px;font-weight:400}
.a{font-family:"Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:12px;font-weight:400;fill:#5F5E5A}
.post{stroke:#888780;stroke-width:1.5}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line class="post" x1="120" y1="118" x2="120" y2="538"/>
<line class="post" x1="450" y1="118" x2="450" y2="538"/>
<line class="post" x1="250" y1="40" x2="250" y2="460"/>
<line class="post" x1="580" y1="40" x2="580" y2="460"/>

<polygon points="250,460 580,460 450,538 120,538" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="t" x="350" y="490" text-anchor="middle" dominant-baseline="central" fill="#633806">Strategy : 戦略</text>
<text class="s" x="350" y="511" text-anchor="middle" dominant-baseline="central" fill="#854F0B">ユーザーニーズ・事業目的</text>

<polygon points="250,355 580,355 450,433 120,433" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="350" y="385" text-anchor="middle" dominant-baseline="central" fill="#085041">Scope : 要件</text>
<text class="s" x="350" y="406" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">機能要件・コンテンツ要件</text>

<polygon points="250,250 580,250 450,328 120,328" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="t" x="350" y="280" text-anchor="middle" dominant-baseline="central" fill="#712B13">Structure : 構造</text>
<text class="s" x="350" y="301" text-anchor="middle" dominant-baseline="central" fill="#993C1D">インタラクション・情報設計</text>

<polygon points="250,145 580,145 450,223 120,223" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="350" y="175" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Skeleton : 骨格</text>
<text class="s" x="350" y="196" text-anchor="middle" dominant-baseline="central" fill="#534AB7">レイアウト・ナビゲーション</text>

<polygon points="250,40 580,40 450,118 120,118" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="t" x="350" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Surface : 表層</text>
<text class="s" x="350" y="91" text-anchor="middle" dominant-baseline="central" fill="#185FA5">ビジュアルデザイン</text>

<line x1="620" y1="70" x2="620" y2="510" stroke="#888780" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="a" x="620" y="48" text-anchor="middle">具体的</text>
<text class="a" x="620" y="536" text-anchor="middle">抽象的</text>
</svg>
